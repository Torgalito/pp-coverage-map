<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium Positioning Coverage — Globe</title>

  <!-- renderer: globe.gl (Three.js) — standalone build bundles three -->
  <script src="https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- DESIGN LAYER -->
  <link rel="stylesheet" href="ui/theme-uber.css" />

  <style>
    /* This demo is a LIGHT / premium variant. Accent + surfaces overridden
       here so the shared blue Uber theme is untouched for the other builds.
       Swap --pp-accent-color to re-brand the covered colour. */
    :root {
      --pp-accent-color: #FF4D00;   /* covered countries + satellite */
      --pp-globe-ocean: #f7f9fb;    /* sphere base (near-white for the glossy look) */
      --pp-globe-land:  #c7cbcf;    /* uncovered countries */
      --pp-globe-border: rgba(255,255,255,0.6);
      --pp-bg: #ffffff;
    }
    html, body { height: 100%; margin: 0; background: var(--pp-bg); }
    #pp-globe { position: absolute; inset: 0; }
    #pp-globe canvas { outline: none; display: block; }

    /* satellite marker */
    .pp-sat { width: 34px; height: 34px; pointer-events: none; transform: translate(-50%, -50%); }
    .pp-sat svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 6px rgba(255,77,0,0.35)); }
  </style>
</head>
<body>
  <div id="pp" class="pp-root pp-theme-light"><div id="pp-globe"></div></div>

  <!-- DATA LAYER (renderer-agnostic) -->
  <script src="core/globe-data.js"></script>

  <script>
    /* ============================================================
     * CONCEPTUAL GLOBE — premium light choropleth (globe.gl/Three.js).
     * Covered countries filled in accent, rest in soft grey, on a
     * glossy studio-lit sphere. Floating satellite motif. Story:
     * a managed positioning platform with global reach.
     * ============================================================ */

    const CTA_URL = 'app.html';
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (window.gsap) gsap.ticker.lagSmoothing(0);

    const css = getComputedStyle(document.documentElement);
    const tok = (n, f) => (css.getPropertyValue(n).trim() || f);
    const COVERED = tok('--pp-accent-color', '#FF4D00');
    const OCEAN   = tok('--pp-globe-ocean', '#eef0f2');
    const LAND    = tok('--pp-globe-land', '#c7cbcf');
    const BORDER  = tok('--pp-globe-border', 'rgba(255,255,255,0.6)');

    const root = document.getElementById('pp');

    /* ---------- minimal light chrome ---------- */
    const header = document.createElement('div');
    header.className = 'pp-panel pp-panel--header';
    header.innerHTML =
      '<h1 class="pp-title">One platform. Every region.</h1>' +
      '<p class="pp-subtitle">Managed multi-network positioning</p>' +
      '<div class="pp-stats">' +
        '<div class="pp-stat"><b id="pp-count">0</b><span>Base stations</span></div>' +
        '<div class="pp-stat"><b id="pp-countries">…</b><span>Countries covered</span></div>' +
      '</div>';
    root.appendChild(header);

    const legend = document.createElement('div');
    legend.className = 'pp-panel pp-panel--legend';
    legend.innerHTML =
      '<div class="pp-legend-row"><span class="pp-dot" style="background:' + COVERED + '"></span>Covered</div>' +
      '<div class="pp-legend-row"><span class="pp-dot" style="background:' + LAND + '"></span>Not yet</div>';
    root.appendChild(legend);

    const caption = document.createElement('div');
    caption.className = 'pp-demo-caption';
    caption.innerHTML = '<div class="pp-caption-card"><span id="pp-cap-title"></span><small id="pp-cap-sub"></small></div>';
    caption.style.opacity = 0;
    root.appendChild(caption);

    const cta = document.createElement('a');
    cta.className = 'pp-demo-cta';
    cta.href = CTA_URL; cta.target = '_top';
    cta.textContent = 'Check your coverage →';
    root.appendChild(cta);

    const hint = document.createElement('div');
    hint.className = 'pp-demo-hint';
    hint.textContent = 'Drag to spin the globe';
    root.appendChild(hint);

    /* ---------- subtle dot-grid texture for the ocean ---------- */
    function dotTexture() {
      const w = 2048, h = 1024, c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.fillStyle = OCEAN; x.fillRect(0, 0, w, h);
      x.fillStyle = 'rgba(120,128,136,0.13)';
      const step = 26, r = 1.05;
      for (let yy = step; yy < h; yy += step)
        for (let xx = step; xx < w; xx += step) {
          x.beginPath(); x.arc(xx, yy, r, 0, Math.PI * 2); x.fill();
        }
      return c.toDataURL();
    }

    /* ---------- globe ---------- */
    const globe = Globe()(document.getElementById('pp-globe'))
      .backgroundColor('rgba(0,0,0,0)')
      .globeImageUrl(dotTexture())
      .showAtmosphere(true)
      .atmosphereColor('#dfe3e7')
      .atmosphereAltitude(0.16)
      .pointOfView({ lat: 32, lng: -25, altitude: 2.2 }, 0);

    /* Glossy studio look: bright sphere with a soft top-centre highlight.
       Three r15x uses physically-scaled lights, so intensities run high and
       we lift renderer exposure. Re-applied after data load because globe.gl
       finishes wiring the material once its texture has decoded. */
    let _fillAdded = false;
    function applyLook() {
      const mat = globe.globeMaterial();
      if (mat) mat.shininess = 30;                 // soft, broad specular
      const ls = globe.lights() || [];
      ls.forEach(l => {
        if (l.type === 'AmbientLight') l.intensity = 2.1;
        if (l.type === 'DirectionalLight') { l.intensity = 2.4; l.position.set(0.15, 0.45, 1); }
      });
      if (!_fillAdded) {
        const dir = ls.find(l => l.type === 'DirectionalLight');
        if (dir && dir.clone) {
          const fill = dir.clone(); fill.intensity = 0.55; fill.position.set(-0.5, 0.1, 0.7);
          globe.lights(ls.concat([fill]));
          _fillAdded = true;
        }
      }
      const r = globe.renderer();
      if (r) r.toneMappingExposure = 1.15;
    }
    applyLook();

    // controls: spin yes, zoom no (no scroll-jack in an iframe)
    const controls = globe.controls();
    controls.enableZoom = false;
    controls.autoRotate = !REDUCED;
    controls.autoRotateSpeed = 0.32;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    function fit() { globe.width(innerWidth).height(innerHeight); }
    addEventListener('resize', fit); fit();

    /* ---------- floating satellite ---------- */
    const SAT_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="' + COVERED + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="9" y="9" width="6" height="6" rx="1" fill="' + COVERED + '" stroke="none"/>' +
      '<path d="M9 9 5.5 5.5M15 15l3.5 3.5M15 9l3.5-3.5M9 15l-3.5 3.5"/>' +
      '<path d="M3.5 7.5 7.5 3.5M16.5 20.5 20.5 16.5"/>' +
      '<circle cx="12" cy="12" r="1.4" fill="#fff" stroke="none"/></svg>';

    globe.htmlElementsData([{ lat: 47, lng: -38, alt: 0.22 }])
      .htmlLat('lat').htmlLng('lng').htmlAltitude('alt')
      .htmlElement(() => { const d = document.createElement('div'); d.className = 'pp-sat'; d.innerHTML = SAT_SVG; return d; });

    /* ---------- choropleth ---------- */
    PPGlobeData.loadChoropleth(
      'data/countries.geo.json',
      [{ id: 'a', url: 'data/service_a.csv' }, { id: 'b', url: 'data/service_b.csv' }],
      3 // a country counts as "covered" at >=3 stations (avoids stray points)
    ).then(({ features, coveredCount, total }) => {

      globe.polygonsData(features)
        .polygonCapColor(d => d.properties.ppCovered ? COVERED : LAND)
        .polygonSideColor(d => d.properties.ppCovered ? 'rgba(255,77,0,0.25)' : 'rgba(150,156,162,0.18)')
        .polygonStrokeColor(() => BORDER)
        .polygonAltitude(d => d.properties.ppCovered ? 0.012 : 0.008)
        .polygonCapCurvatureResolution(4)
        .polygonsTransitionDuration(REDUCED ? 0 : 900);

      // stats
      const node = document.getElementById('pp-count');
      if (REDUCED || !window.gsap) node.textContent = total.toLocaleString('en-US');
      else {
        const o = { v: 0 };
        gsap.to(o, { v: total, duration: 1.6, ease: 'power2.out',
          onUpdate: () => { node.textContent = Math.round(o.v).toLocaleString('en-US'); } });
        gsap.from([header, legend, cta, hint], { y: 14, opacity: 0, duration: 0.7, stagger: 0.1, ease: 'power3.out', clearProps: 'opacity,transform' });
      }
      document.getElementById('pp-countries').textContent = coveredCount;

      applyLook();  // material is fully wired by now — make the gloss stick

      if (!REDUCED) setTimeout(() => { if (!tourStopped) runTour(features, total); }, 1900);
    });

    /* ---------- guided tour ---------- */
    let tourTimer = null, tourStopped = false;
    const STOPS = [
      { lat: 54, lng: 12,  name: 'Europe', sub: 'Multi-network reliability, one contract' },
      { lat: 42, lng: -92, name: 'North America', sub: 'Redundant coverage where it matters' },
      { lat: -28, lng: 134, name: 'Asia–Pacific', sub: 'Centralised control and visibility' }
    ];

    function runTour() {
      let i = -1;
      function next() {
        if (document.hidden) { tourTimer = setTimeout(next, 1500); return; }
        i = (i + 1) % (STOPS.length + 1);
        if (i === STOPS.length) {
          setCaption('Wherever you operate', 'One managed platform, every region');
          globe.pointOfView({ lat: 25, lng: -25, altitude: 2.2 }, 2400);
        } else {
          const s = STOPS[i];
          setCaption(s.name, s.sub);
          globe.pointOfView({ lat: s.lat, lng: s.lng, altitude: 1.85 }, 2400);
        }
        tourTimer = setTimeout(next, 6200);
      }
      next();
    }

    function setCaption(title, sub) {
      const t = document.getElementById('pp-cap-title'), s = document.getElementById('pp-cap-sub');
      if (!window.gsap) { t.textContent = title; s.textContent = sub; caption.style.opacity = 1; return; }
      gsap.timeline()
        .to(caption, { opacity: 0, y: 8, duration: 0.25, ease: 'power2.in' })
        .call(() => { t.textContent = title; s.textContent = sub; })
        .to(caption, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' });
    }

    ['pointerdown', 'touchstart', 'wheel'].forEach(evt =>
      root.addEventListener(evt, stopTour, { passive: true }));
    function stopTour() {
      if (tourStopped) return;
      tourStopped = true;
      clearTimeout(tourTimer);
      controls.autoRotate = false;
      if (window.gsap) { gsap.to(caption, { opacity: 0, duration: 0.3 }); gsap.to(hint, { opacity: 0, delay: 2.5, duration: 0.6 }); }
    }

    window.ppGlobe = globe;
  </script>
</body>
</html>
