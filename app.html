<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium Positioning Coverage — App</title>

  <!-- libs -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.36/dist.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- DESIGN LAYER: swap this file for a different art direction -->
  <link rel="stylesheet" href="ui/theme-uber.css" />

  <style>html, body { height: 100%; margin: 0; }</style>
</head>
<body>
  <div id="pp" class="pp-root"><div id="pp-map" class="pp-map"></div></div>

  <!-- FUNCTIONAL LAYER -->
  <script src="core/engine.js"></script>
  <!-- UI LAYER -->
  <script src="ui/components.js"></script>

  <script>
    /* --- restore shared state from URL hash (#v=heatmap&c=lat,lon,zoom) --- */
    const params = new URLSearchParams(location.hash.replace(/^#/, ''));
    const cam = (params.get('c') || '').split(',').map(Number);
    const hasCam = cam.length === 3 && cam.every(n => !isNaN(n));

    const engine = new PPMap({
      container: '#pp-map',
      services: [
        { id: 'a', label: 'Network 1', url: 'data/service_a.csv' },
        { id: 'b', label: 'Network 2', url: 'data/service_b.csv' }
      ],
      config: Object.assign(
        {
          view: params.get('v') || 'coverage',
          basemap: 'dark',
          probeOnClick: true   // click anywhere = coverage verdict
        },
        hasCam ? { initialViewState: { latitude: cam[0], longitude: cam[1], zoom: cam[2], pitch: 0, bearing: 0 } } : {}
      )
    });

    PPMapUI.buildAppUI(engine, document.getElementById('pp'), {
      title: 'Premium Positioning Coverage',
      subtitle: 'Check coverage where you operate',
      dataDate: 'June 2026',
      cta: {
        /* primary journey: reseller / OEM / enterprise — custom, sales-led */
        primary: { label: 'Talk to an engineer', href: '#contact-engineer' },
        /* secondary journey: solo operator — self-serve trial */
        secondary: { label: 'Start 14-day free trial', href: '#start-trial' }
      }
    });

    engine.on('ready', () => {
      if (!hasCam) engine.fitToData(80);
      engine.loadCountries('data/countries.geo.json');
    });

    /* --- keep URL hash in sync (shareable views for procurement etc.) --- */
    let hashTimer = null;
    function syncHash() {
      clearTimeout(hashTimer);
      hashTimer = setTimeout(() => {
        const c = engine.map.getCenter(), z = engine.map.getZoom();
        const v = engine.getState().view;
        history.replaceState(null, '',
          '#v=' + v + '&c=' + c.lat.toFixed(3) + ',' + c.lng.toFixed(3) + ',' + z.toFixed(2));
      }, 250);
    }
    engine.map.on('moveend', syncHash);
    engine.on('statechange', syncHash);

    // console / integration access
    window.ppEngine = engine;
  </script>
</body>
</html>
